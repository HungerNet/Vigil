name: Build and release

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK (JNI headers only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Tests (detection, utilities, identity)
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify embedded Java shims are reproducible
        # Informational: javac output can differ across JDK patch releases.
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/build_java.py --javac "$env:JAVA_HOME\bin\javac.exe"
          git diff --exit-code -- src/game/bytecode

      - name: Read version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $yaml = Get-Content version.yaml -Raw
          $run = if ($yaml -match '(?m)^run:\s*(\w+)') { $Matches[1] } else { 'false' }
          $version = if ($yaml -match "(?m)^version:\s*'?([^'\r\n]+)'?") { $Matches[1] } else { '0.0.0' }
          "RUN=$run" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Package
        if: github.event_name == 'push' && env.RUN == 'true'
        shell: pwsh
        run: |
          # Users download one file. Vigil.exe carries the runtime and writes it to
          # %LOCALAPPDATA%\Vigil\runtime on first run.
          $exe = "build/Release/Vigil.exe"
          Copy-Item $exe "Vigil.exe"
          $hash = (Get-FileHash Vigil.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  Vigil.exe" | Set-Content -Encoding ascii "Vigil.exe.sha256"
          "SHA256=$hash" >> $env:GITHUB_ENV

      - name: Publish release
        if: github.event_name == 'push' && env.RUN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Vigil ${{ env.VERSION }}
          body_path: docs/RELEASE_NOTES.md
          files: |
            Vigil.exe
            Vigil.exe.sha256
