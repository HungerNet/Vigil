name: Build and release

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK (JNI headers only)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Detection tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify embedded Java shims are reproducible
        # Informational: javac output can differ across JDK patch releases.
        continue-on-error: true
        shell: pwsh
        run: |
          python tools/build_java.py --javac "$env:JAVA_HOME\bin\javac.exe"
          git diff --exit-code -- src/game/bytecode

      - name: Read version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $yaml = Get-Content version.yaml -Raw
          $run = if ($yaml -match '(?m)^run:\s*(\w+)') { $Matches[1] } else { 'false' }
          $version = if ($yaml -match "(?m)^version:\s*'?([^'\r\n]+)'?") { $Matches[1] } else { '0.0.0' }
          "RUN=$run" >> $env:GITHUB_ENV
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Package
        if: github.event_name == 'push' && env.RUN == 'true'
        shell: pwsh
        run: |
          $package = "Vigil-$env:VERSION-win-x64"
          $stage = Join-Path $env:RUNNER_TEMP $package
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build/Release/Vigil.dll $stage
          Copy-Item build/Release/VigilLauncher.exe $stage
          Copy-Item assets/fonts/LICENSE-Inter.txt $stage
          @(
            "Vigil $env:VERSION - cheat detection and player analysis for Lunar Client 1.8.9"
            ""
            "1. Start Minecraft 1.8.9 in Lunar Client."
            "2. Run VigilLauncher.exe (keep it next to Vigil.dll)."
            "3. Press Right Shift in game, or type /vigil in chat."
            ""
            "Vigil stores its settings and session data in the 'vigil' folder next to Vigil.dll."
            "It makes no network requests."
          ) | Set-Content -Encoding utf8 "$stage\README.txt"
          Compress-Archive -Path "$stage\*" -DestinationPath "$package.zip" -Force
          "PACKAGE_FILE=$package.zip" >> $env:GITHUB_ENV

      - name: Publish release
        if: github.event_name == 'push' && env.RUN == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Vigil ${{ env.VERSION }}
          body_path: docs/RELEASE_NOTES.md
          files: ${{ env.PACKAGE_FILE }}
