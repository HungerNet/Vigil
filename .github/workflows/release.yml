# Release — publishes Vigil-<version>.exe, only after the Validate workflow succeeded in this same
# run, and only from the exact artifact Validate built and checked.
#
#   validate   the full Validate workflow (workflow_call): lint, metadata, build, tests, self-check
#   gate       decides whether to publish: version.yaml `run: true`, and the tag does not exist yet
#              (a published version is never overwritten with different binaries)
#   publish    re-verifies the downloaded artifact, names it, writes SHA256SUMS, publishes, and
#              checks what GitHub now serves
#
# See docs/RELEASE_PROCESS.md.
name: Release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate
    uses: ./.github/workflows/validate.yml

  gate:
    name: Release gate
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.decide.outputs.publish }}
    steps:
      - name: Decide
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate.outputs.version }}
          RUN: ${{ needs.validate.outputs.run }}
        run: |
          if [ "$RUN" != "true" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "### Not published: version.yaml has \`run: false\`" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Not published: ${VERSION} already exists"
              echo "A published version is never replaced. Bump \`version\` in version.yaml (and the release notes) to publish this build."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "### Publishing ${VERSION}" >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish
    needs: [validate, gate]
    if: needs.gate.outputs.publish == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      ASSET: ${{ needs.validate.outputs.asset }}
    steps:
      - uses: actions/checkout@v4

      - name: Download the validated build
        uses: actions/download-artifact@v4
        with:
          name: vigil-validated
          path: validated

      - name: Re-verify and package
        shell: pwsh
        run: |
          # The artifact must still be what Validate checked: run its self-check again here.
          $report = Join-Path $PWD 'recheck.json'
          $p = Start-Process -FilePath ./validated/Vigil.exe -ArgumentList '--self-check', "`"$report`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $report; throw "Self-check failed on the downloaded artifact." }
          $before = Get-Content ./validated/selfcheck.json -Raw | ConvertFrom-Json
          $after = Get-Content $report -Raw | ConvertFrom-Json
          if ($before.runtimeSha256 -ne $after.runtimeSha256 -or $after.exeVersion -ne $env:VERSION) { throw "Artifact changed after validation." }
          Copy-Item ./validated/Vigil.exe $env:ASSET
          $hash = (Get-FileHash $env:ASSET -Algorithm SHA256).Hash.ToLower()
          "$hash  $env:ASSET" | Set-Content -Encoding ascii SHA256SUMS
          "SHA256=$hash" >> $env:GITHUB_ENV
          Get-Content SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Vigil ${{ env.VERSION }}
          body_path: docs/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            ${{ env.ASSET }}
            SHA256SUMS

      - name: Verify the published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $rel = gh release view $env:VERSION --json assets | ConvertFrom-Json
          $names = $rel.assets | ForEach-Object { $_.name }
          foreach ($want in @($env:ASSET, 'SHA256SUMS')) {
            if ($names -notcontains $want) { throw "Release is missing $want (has: $($names -join ', '))." }
          }
          $exe = $rel.assets | Where-Object { $_.name -eq $env:ASSET }
          if ($exe.size -ne (Get-Item $env:ASSET).Length) { throw "Published $env:ASSET has a different size." }
          "### Published Vigil $env:VERSION" >> $env:GITHUB_STEP_SUMMARY
          "``$env:ASSET`` SHA-256 ``$env:SHA256``" >> $env:GITHUB_STEP_SUMMARY
